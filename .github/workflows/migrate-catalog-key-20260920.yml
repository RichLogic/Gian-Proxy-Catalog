name: One-time Catalog Key Migration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-key-migration-20260920
  cancel-in-progress: false
jobs:
  seal-for-destination:
    if: github.repository == 'RichLogic/Gian-Proxy-Catalog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned encryption library without any secret in the environment
        run: python -m pip install --disable-pip-version-check --no-input --only-binary=:all: PyNaCl==1.6.2
      - name: Validate the existing signer and seal only for the pinned destination environment
        env:
          GIAN_CATALOG_SIGNING_KEY_PEM: ${{ secrets.GIAN_CATALOG_SIGNING_KEY_PEM }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          from nacl import encoding, public

          secret = os.environ.pop('GIAN_CATALOG_SIGNING_KEY_PEM', '')
          if not secret or len(secret) > 8192:
              raise RuntimeError('Original signing key is missing or invalid')
          checked = subprocess.run(['openssl', 'pkey', '-pubout', '-outform', 'DER'],
                                   input=secret.encode('utf-8'), capture_output=True, check=False)
          expected = bytes.fromhex('302a300506032b65700321008721796e6bdf8798804745396bd2181cd999f261d077f09a6fdaa180091344df')
          if checked.returncode != 0 or checked.stdout != expected:
              raise RuntimeError('Signing key does not match the existing Host trust pin')
          recipient = public.PublicKey(b'keE5sLZWeFNopmUdPLbgd/0H3zdrtnwkBhMQLZAE2BI=', encoding.Base64Encoder())
          ciphertext = public.SealedBox(recipient).encrypt(secret.encode('utf-8'))
          del secret
          payload = {
              'destination': 'RichLogic/Gian-Proxies/catalog-production',
              'secret_name': 'GIAN_CATALOG_SIGNING_KEY_PEM',
              'key_id': '3380204578043523366',
              'encrypted_value': base64.b64encode(ciphertext).decode('ascii'),
          }
          target = Path(os.environ['RUNNER_TEMP']) / 'sealed-catalog-key.json'
          target.write_text(json.dumps(payload), encoding='utf-8')
          target.chmod(0o600)
          print('Original signer verified; destination-only encrypted payload created')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-catalog-key-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-catalog-key.json
          if-no-files-found: error
          retention-days: 1
