name: Release Signed Gian Catalog

on:
  workflow_dispatch:
    inputs:
      gian_ref:
        description: Exact certified RichLogic/Gian commit SHA
        required: true
        type: string
      sequence:
        description: Monotonic Catalog sequence number
        required: true
        type: string
      issued_at:
        description: Reproducible ISO-8601 issue time
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: catalog-release
  cancel-in-progress: false

jobs:
  publish-signed-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Catalog source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate immutable Gian revision
        env:
          GIAN_REF: ${{ inputs.gian_ref }}
        run: |
          [[ "${GIAN_REF}" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out certified Gian toolchain
        uses: actions/checkout@v6
        with:
          repository: RichLogic/Gian
          ref: ${{ inputs.gian_ref }}
          path: gian-source
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gian-source/pnpm-lock.yaml

      - name: Install Gian toolchain dependencies
        working-directory: gian-source
        run: pnpm install --frozen-lockfile

      - name: Build Catalog compiler and trust policy
        working-directory: gian-source
        run: |
          pnpm --filter @gian/shared build
          pnpm --filter @gian/proxy-protocol build
          pnpm --filter @gian/proxy-catalog-contract build

      - name: Verify installable Catalog source
        run: >-
          node gian-source/scripts/verify-official-catalog-release-source.mjs
          --source-root "${GITHUB_WORKSPACE}/catalog/official-source"

      - name: Compile and verify production signature
        env:
          GIAN_CATALOG_SIGNING_KEY_PEM: ${{ secrets.GIAN_CATALOG_SIGNING_KEY_PEM }}
          SEQUENCE: ${{ inputs.sequence }}
          ISSUED_AT: ${{ inputs.issued_at }}
        run: |
          test -n "${GIAN_CATALOG_SIGNING_KEY_PEM}"
          node gian-source/scripts/compile-official-catalog.mjs \
            --source-root "${GITHUB_WORKSPACE}/catalog/official-source" \
            --sequence "${SEQUENCE}" \
            --issued-at "${ISSUED_AT}" \
            --out "${GITHUB_WORKSPACE}/output/catalog-release/bundle"
          node gian-source/scripts/stage-official-catalog-release.mjs \
            --bundle "${GITHUB_WORKSPACE}/output/catalog-release/bundle" \
            --output "${GITHUB_WORKSPACE}/output/catalog-release/assets"

      - name: Require authorized immutable Catalog tag
        env:
          SEQUENCE: ${{ inputs.sequence }}
        run: |
          TAG="catalog-v1.${SEQUENCE}.0"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}"
          else
            echo "::error::An authorized maintainer must create ${TAG} at ${GITHUB_SHA}."
            exit 1
          fi

      - name: Publish immutable Catalog assets
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE: ${{ inputs.sequence }}
        run: |
          TAG="catalog-v1.${SEQUENCE}.0"
          RELEASE_ASSETS=(output/catalog-release/assets/*)
          validate_existing_release() {
            local release_json path name expected_size expected_digest
            release_json="$(gh release view "${TAG}" --json tagName,isDraft,isPrerelease,assets 2>/dev/null)" || return 1
            test "$(jq -r '.tagName' <<<"${release_json}")" = "${TAG}" || return 1
            test "$(jq -r '.isDraft' <<<"${release_json}")" = false || return 1
            test "$(jq -r '.isPrerelease' <<<"${release_json}")" = false || return 1
            test "$(jq '.assets | length' <<<"${release_json}")" -eq "${#RELEASE_ASSETS[@]}" || return 1
            for path in "${RELEASE_ASSETS[@]}"; do
              name="${path##*/}"
              expected_size="$(stat -c '%s' "${path}")"
              expected_digest="sha256:$(sha256sum "${path}" | awk '{print $1}')"
              jq -e \
                --arg name "${name}" \
                --argjson size "${expected_size}" \
                --arg digest "${expected_digest}" \
                '[.assets[] | select(.name == $name and .size == $size and .digest == $digest)] | length == 1' \
                <<<"${release_json}" >/dev/null || return 1
            done
          }
          if validate_existing_release; then exit 0; fi
          for ATTEMPT in 1 2 3; do
            if gh release create "${TAG}" \
              "${RELEASE_ASSETS[@]}" \
              --verify-tag \
              --latest \
              --title "Gian Catalog ${TAG}" \
              --notes "Signed immutable Gian Proxy and Runtime Catalog."; then
              validate_existing_release
              exit $?
            fi
            if validate_existing_release; then exit 0; fi
            if [ "${ATTEMPT}" -eq 3 ]; then exit 1; fi
            sleep $((ATTEMPT * 5))
          done
